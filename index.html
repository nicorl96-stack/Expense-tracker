<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;--bg:#f8fafc;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#0f172a} [data-theme=dark]{--bg:#020617;--panel:#0f172a;--text:#f8fafc;--muted:#94a3b8;--border:#1e293b;--primary:#f8fafc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:22px;border-right:1px solid var(--border);background:var(--panel)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.mark{width:44px;height:44px;border-radius:16px;background:var(--primary);color:var(--bg);display:grid;place-items:center;font-weight:900}.nav{display:grid;gap:8px}.nav button,.tabs button{border:0;border-radius:14px;min-height:44px;background:transparent;color:var(--muted);text-align:left;padding:0 12px;cursor:pointer}.nav .active,.tabs .active,.btn{background:var(--primary);color:var(--bg)}main{padding:28px;max-width:1180px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:22px;align-items:start}.muted{color:var(--muted)}h1,h2,h3,p{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;min-height:44px;padding:0 16px;font-weight:800;cursor:pointer}.secondary{background:rgba(100,116,139,.16);color:var(--text)}.danger{background:#dc2626;color:white}input,select{min-height:44px;border:1px solid var(--border);border-radius:14px;padding:0 12px;background:var(--panel);color:var(--text);width:100%}.hero{border-radius:28px;padding:26px;background:var(--primary);color:var(--bg);box-shadow:0 18px 45px rgba(15,23,42,.1)}.amount{font-size:clamp(38px,7vw,64px);font-weight:900;margin-top:8px}.bar{height:9px;border-radius:99px;background:rgba(100,116,139,.22);overflow:hidden;margin-top:14px}.bar span{display:block;height:100%;width:var(--w);background:#22c55e;border-radius:99px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.card,.row{border:1px solid var(--border);border-radius:22px;background:var(--panel);box-shadow:0 18px 45px rgba(15,23,42,.07)}.card{padding:18px}.card strong{display:block;font-size:24px;margin-top:8px}.row{padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.rowMain{display:flex;align-items:center;gap:12px}.icon{width:42px;height:42px;border-radius:14px;background:rgba(100,116,139,.16);display:grid;place-items:center}.pill{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.split{grid-template-columns:380px 1fr;align-items:start}form{display:grid;gap:12px}.list{display:grid;gap:12px}.empty{border:1px dashed var(--border);border-radius:20px;padding:28px;text-align:center;color:var(--muted)}.tabs{display:none;position:fixed;left:0;right:0;bottom:0;padding:9px;gap:6px;overflow-x:auto;border-top:1px solid var(--border);background:var(--panel)}.tabs button{min-width:88px;text-align:center;font-size:12px}@media(max-width:900px){.app{display:block}.side{display:none}main{padding:18px 14px 88px}.tabs{display:flex}.stats,.split{grid-template-columns:1fr}.top{display:grid}.actions>*{flex:1}}
  </style>
</head>
<body>
  <div id="app"></div>
    <script>
    var money = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
    var monthFmt = new Intl.DateTimeFormat('es-CO',{month:'long',year:'numeric'});
    var dateFmt = new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'});
    var initial = {view:'inicio',accountSection:'ingresos',theme:'light',month:new Date().toISOString().slice(0,7),goal:800000,statsCategory:null,incomes:[{id:'salario',name:'Salario',amount:4500000}],cats:[['Mercado','M',900000],['Transporte','T',320000],['Restaurantes','R',420000],['Entretenimiento','E',260000],['Compras','C',380000],['Hogar','H',500000],['Salud','S',250000],['Educación','Ed',280000],['Servicios','Sv',650000],['Otros','O',220000]].map(function(c,i){return{id:'c'+i,name:c[0],icon:c[1],budget:c[2]}}),expenses:[],recurring:[]};
    var state = JSON.parse(localStorage.getItem('gastos-colombia-demo')||'null') || initial;
    migrateState();
    function migrateState(){
      if(!Array.isArray(state.incomes)) state.incomes=[{id:'salario',name:'Salario',amount:Number(state.income||4500000)}];
      if(!state.accountSection) state.accountSection='ingresos';
      if(typeof state.statsCategory==='undefined') state.statsCategory=null;
      var oldSections={'categorías':'categorias','categorÃ­as':'categorias','estadísticas':'estadisticas','estadÃ­sticas':'estadisticas',recurrentes:'recurrentes',respaldo:'respaldo',ajustes:'ajustes'};
      if(oldSections[state.view]){state.accountSection=oldSections[state.view];state.view='cuenta'}
      if(['inicio','gastos','ahorro','cuenta'].indexOf(state.view)===-1) state.view='inicio';
      state.cats.forEach(function(c){c.name=cleanText(c.name)});
      save();
    }
    function cleanText(text){return String(text).replaceAll('EducaciÃ³n','Educación').replaceAll('CategorÃ­a','Categoría').replaceAll('categorÃ­a','categoría').replaceAll('DescripciÃ³n','Descripción').replaceAll('informaciÃ³n','información')}
    function save(){localStorage.setItem('gastos-colombia-demo',JSON.stringify(state))}
    function monthExpenses(){return state.expenses.filter(function(e){return e.date.slice(0,7)===state.month})}
    function spentFor(id){return monthExpenses().filter(function(e){return e.cat===id}).reduce(function(a,e){return a+e.amount},0)}
    function totalSpent(){return monthExpenses().reduce(function(a,e){return a+e.amount},0)}
    function totalIncome(){return state.incomes.reduce(function(a,i){return a+Number(i.amount||0)},0)}
    function assignedBudget(){return state.cats.reduce(function(a,c){return a+Number(c.budget||0)},0)}
    function pct(a,b){return b?Math.round(a/b*100):0}
    function tone(v){return v>=100?'red':v>=80?'yellow':'green'}
    var nav=['inicio','gastos','ahorro','cuenta'];
    var titles={inicio:'Resumen mensual',gastos:'Gastos',ahorro:'Ahorro',cuenta:'Cuenta'};
    var accountLabels={ingresos:'Ingresos',categorias:'Categorías',estadisticas:'Estadísticas',recurrentes:'Recurrentes',respaldo:'Respaldo',ajustes:'Ajustes'};
    function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
    window.go=function(v){state.view=v;save();render()};
    window.goAccount=function(v){state.view='cuenta';state.accountSection=v;save();render()};
    window.theme=function(){state.theme=state.theme==='dark'?'light':'dark';save();render()};
    function shell(html){document.documentElement.dataset.theme=state.theme;document.getElementById('app').innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="mark">$</div><div><h1>Gastos</h1><p class="muted">Presupuesto cero</p></div></div><nav class="nav">'+nav.map(function(n){return '<button onclick="go(\''+n+'\')" class="'+(state.view===n?'active':'')+'">'+cap(n)+'</button>'}).join('')+'</nav></aside><main><div class="top"><div><p class="muted">'+monthFmt.format(new Date(state.month+'-01T00:00:00'))+'</p><h2>'+titles[state.view]+'</h2></div><div class="actions"><input type="month" value="'+state.month+'" onchange="state.month=this.value;save();render()"></div></div>'+html+'</main><nav class="tabs">'+nav.map(function(n){return '<button onclick="go(\''+n+'\')" class="'+(state.view===n?'active':'')+'">'+cap(n)+'</button>'}).join('')+'</nav></div>'}
    function card(l,v,d){return '<article class="card"><p class="muted">'+l+'</p><strong>'+v+'</strong>'+(d?'<p class="muted">'+d+'</p>':'')+'</article>'}
    function catCard(c){var s=spentFor(c.id),p=pct(s,c.budget);return '<article class="row"><div class="rowMain"><div class="icon">'+c.icon+'</div><div><h3>'+c.name+'</h3><p class="muted">'+money.format(s)+' de '+money.format(c.budget)+'</p><div class="bar" style="--w:'+Math.min(p,100)+'%"><span></span></div></div></div><span class="pill '+tone(p)+'">'+p+'%</span></article>'}
    function inicio(){var spent=totalSpent(),income=totalIncome(),assigned=assignedBudget(),free=income-state.goal-assigned,available=income-state.goal-spent,used=pct(spent,income),ex=monthExpenses(),big=ex.slice().sort(function(a,b){return b.amount-a.amount})[0],top=state.cats.slice().sort(function(a,b){return spentFor(b.id)-spentFor(a.id)})[0];shell('<section class="hero"><p>Total gastado</p><div class="amount">'+money.format(spent)+'</div><p>Presupuesto mensual: '+money.format(income)+' · Disponible después de ahorro: '+money.format(available)+'</p><div class="bar" style="--w:'+Math.min(used,100)+'%"><span></span></div><p>Has usado el '+used+'% de tus ingresos del mes.</p></section><section class="grid stats">'+card('Ingresos del mes',money.format(income),'Se editan en Cuenta > Ingresos')+card('Número de gastos',ex.length)+card('Por asignar',money.format(free),'Ingresos - ahorro - categorías')+card('Mayor gasto',big?money.format(big.amount):money.format(0),big?big.desc:'')+'</section><section class="grid stats">'+card('Meta de ahorro',money.format(state.goal))+card('Presupuestado en categorías',money.format(assigned))+card('Categoría principal',top?top.name:'Sin datos',top?money.format(spentFor(top.id)):'')+card('Disponible real',money.format(available))+'</section><section class="grid">'+state.cats.map(catCard).join('')+'</section>')}
    function gastos(){shell('<section class="grid split"><form class="card" onsubmit="addExpense(event)"><label>Valor<input name="amount" type="number" min="1" step="1" required></label><label>Categoría<select name="cat">'+state.cats.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>'}).join('')+'</select></label><label>Descripción<input name="desc" required placeholder="Ej. Almuerzo"></label><label>Fecha<input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></label><button class="btn">Guardar</button></form><section class="list">'+(monthExpenses().map(expenseRow).join('')||'<div class="empty">No hay gastos para mostrar.</div>')+'</section></section>')}
    function expenseRow(e){var c=state.cats.find(function(c){return c.id===e.cat})||{};return '<article class="row"><div class="rowMain"><div class="icon">'+(c.icon||'COP')+'</div><div><h3>'+e.desc+'</h3><p class="muted">'+(c.name||'Sin categoría')+' · '+dateFmt.format(new Date(e.date+'T00:00:00'))+'</p></div></div><div><strong>'+money.format(e.amount)+'</strong><button class="btn danger" onclick="delExpense(\''+e.id+'\')">Eliminar</button></div></article>'}
    window.addExpense=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));state.expenses.unshift({id:crypto.randomUUID(),amount:Number(d.amount),cat:d.cat,desc:d.desc,date:d.date});save();render()};
    window.delExpense=function(id){state.expenses=state.expenses.filter(function(e){return e.id!==id});save();render()};
    function ahorro(){var income=totalIncome(),spent=totalSpent(),saved=Math.max(0,income-spent),progress=pct(Math.min(saved,state.goal),state.goal),available=income-state.goal-spent;shell('<section class="grid stats">'+card('Ingresos del mes',money.format(income),'Edita ingresos en Cuenta')+card('Meta de ahorro',money.format(state.goal))+card('Disponible para gastar',money.format(available))+card('Progreso',progress+'%')+'</section><form class="card" onsubmit="saveSavings(event)"><label>Meta de ahorro mensual<input name="goal" type="number" min="0" step="1" value="'+state.goal+'"></label><button class="btn">Guardar meta</button></form>')}
    window.saveSavings=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));state.goal=Number(d.goal);save();render()};
    function cuenta(){var sections=['ingresos','categorias','estadisticas','recurrentes','respaldo','ajustes'];shell('<section class="grid stats">'+sections.map(function(s){return '<button class="card" style="text-align:left;cursor:pointer" onclick="goAccount(\''+s+'\')"><p class="muted">Cuenta</p><strong>'+accountLabels[s]+'</strong></button>'}).join('')+'</section>'+accountContent())}
    function accountContent(){return ({ingresos:ingresos,categorias:categorias,estadisticas:estadisticas,recurrentes:recurrentes,respaldo:respaldo,ajustes:ajustes})[state.accountSection]()}
    function ingresos(){return '<section class="card"><h3>Ingresos</h3><p class="muted">Suma salario, trabajos extra u otros ingresos. Este total alimenta el presupuesto mensual de Inicio.</p><form onsubmit="addIncome(event)" style="margin-top:14px"><label>Nombre<input name="name" required placeholder="Ej. Salario"></label><label>Valor mensual<input name="amount" type="number" min="0" step="1" required></label><button class="btn">Agregar ingreso</button></form></section><section class="grid stats">'+card('Total ingresos',money.format(totalIncome()))+card('Meta de ahorro',money.format(state.goal))+card('Presupuesto categorías',money.format(assignedBudget()))+card('Por asignar',money.format(totalIncome()-state.goal-assignedBudget()))+'</section><section class="list">'+state.incomes.map(function(i){return '<article class="row"><div><h3>'+i.name+'</h3><p class="muted">Ingreso mensual</p></div><div><strong>'+money.format(i.amount)+'</strong><button class="btn danger" onclick="delIncome(\''+i.id+'\')">Eliminar</button></div></article>'}).join('')+'</section>'}
    window.addIncome=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));state.incomes.push({id:crypto.randomUUID(),name:d.name,amount:Number(d.amount)});save();render()};
    window.delIncome=function(id){state.incomes=state.incomes.filter(function(i){return i.id!==id});save();render()};
    function categorias(){return '<form class="card" onsubmit="addCat(event)" style="margin-bottom:16px"><label>Nombre<input name="name" required></label><label>Ícono<input name="icon" placeholder="Ej. M, $, Casa" required></label><label>Presupuesto mensual<input name="budget" type="number" min="0" step="1" required></label><button class="btn">Guardar</button></form><section class="grid">'+state.cats.map(function(c){return catCard(c)+'<button class="btn danger" onclick="delCat(\''+c.id+'\')">Eliminar '+c.name+'</button>'}).join('')+'</section>'}
    window.addCat=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));state.cats.push({id:crypto.randomUUID(),name:d.name,icon:d.icon,budget:Number(d.budget)});save();render()};
    window.delCat=function(id){state.cats=state.cats.filter(function(c){return c.id!==id});state.expenses=state.expenses.filter(function(e){return e.cat!==id});save();render()};
    function estadisticas(){var s=totalSpent(),income=totalIncome(),selected=state.cats.find(function(c){return c.id===state.statsCategory}),items=selected?monthExpenses().filter(function(e){return e.cat===selected.id}):[];return '<section class="grid stats">'+card('Promedio diario',money.format(s/Math.max(1,new Date().getDate())))+card('Total de gastos',monthExpenses().length)+card('Disponible real',money.format(income-state.goal-s))+card('Uso de ingresos',pct(s,income)+'%')+'</section><section class="grid">'+state.cats.map(function(c){return '<button class="card" style="text-align:left;cursor:pointer" onclick="showStatCat(\''+c.id+'\')"><p class="muted">'+c.name+'</p><strong>'+money.format(spentFor(c.id))+'</strong><p class="muted">Tocar para ver gastos</p></button>'}).join('')+'</section>'+(selected?'<section class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px"><div><p class="muted">Detalle de categoría</p><h3>'+selected.name+'</h3></div><button class="btn secondary" onclick="showStatCat(null)">Cerrar</button></div><section class="list">'+(items.map(expenseRow).join('')||'<div class="empty">No hay gastos en esta categoría durante el mes seleccionado.</div>')+'</section></section>':'')}
    window.showStatCat=function(id){state.statsCategory=id;save();render()};
    function recurrentes(){return '<form class="card" onsubmit="addRec(event)"><label>Valor<input name="amount" type="number" min="1" step="1" required></label><label>Descripción<input name="desc" required></label><label>Frecuencia<select name="freq"><option>Mensual</option><option>Semanal</option><option>Personalizada</option></select></label><button class="btn">Guardar</button></form><section class="list" style="margin-top:16px">'+(state.recurring.map(function(r){return '<article class="row"><h3>'+r.desc+'</h3><strong>'+money.format(r.amount)+'</strong></article>'}).join('')||'<div class="empty">No hay gastos recurrentes.</div>')+'</section>'}
    window.addRec=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));state.recurring.push({id:crypto.randomUUID(),desc:d.desc,amount:Number(d.amount),freq:d.freq});save();render()};
    function respaldo(){return '<section class="grid stats"><button class="btn" onclick="downloadBackup()">Exportar JSON</button><button class="btn secondary" onclick="downloadCsv()">Exportar CSV</button><label class="card">Importar respaldo<input type="file" accept="application/json" onchange="restoreBackup(event)"></label></section>'}
    window.downloadBackup=function(){download('gastos-backup.json',JSON.stringify(state,null,2),'application/json')}; window.downloadCsv=function(){download('gastos.csv','descripcion,valor,fecha\n'+state.expenses.map(function(e){return e.desc+','+e.amount+','+e.date}).join('\n'),'text/csv')};
    function download(name,content,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
    window.restoreBackup=async function(e){var f=e.target.files[0];if(!f)return;Object.assign(state,JSON.parse(await f.text()));migrateState();save();render()};
    function ajustes(){return '<section class="card"><h3>Apariencia</h3><p class="muted">Activa modo claro u oscuro.</p><button class="btn secondary" onclick="theme()">'+(state.theme==='dark'?'Modo claro':'Modo oscuro')+'</button></section><section class="card" style="margin-top:16px"><h3>Privacidad</h3><p class="muted">Toda la información permanece en este dispositivo. No hay cuentas, servidor ni nube.</p></section>'}
    function render(){({inicio:inicio,gastos:gastos,ahorro:ahorro,cuenta:cuenta})[state.view]()}
    render();
  </script>
</body>
</html>
